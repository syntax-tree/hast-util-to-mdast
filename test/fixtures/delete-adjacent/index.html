<p>Delete: <del>a</del><del>b</del>.</p>
<p>Mixed: <del>a</del><s>b</s><strike>c</strike>.</p>
<p>Nested: <del><em>a</em></del><del>b</del>.</p>
<p>Ignored between: <del>a</del><!-- comment --><del>b</del>.</p>
<p>Whitespace between: <del>a</del> <del>b</del>.</p>
<p>Wrapped: <em><del>a</del></em><del>b</del>.</p>
